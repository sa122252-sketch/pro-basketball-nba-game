<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="ballGrad" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#ff8c61;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b35;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>
  
  <!-- Border -->
  <rect x="20" y="20" width="472" height="472" fill="none" stroke="#ff6b35" stroke-width="12" rx="40"/>
  
  <!-- Basketball shadow -->
  <circle cx="260" cy="260" r="140" fill="rgba(0,0,0,0.3)"/>
  
  <!-- Basketball -->
  <circle cx="256" cy="256" r="140" fill="url(#ballGrad)"/>
  
  <!-- Ball lines -->
  <line x1="256" y1="116" x2="256" y2="396" stroke="#1a1a2e" stroke-width="5"/>
  <line x1="116" y1="256" x2="396" y2="256" stroke="#1a1a2e" stroke-width="5"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#1a1a2e" stroke-width="5"/>
  <circle cx="256" cy="256" r="90" fill="none" stroke="#1a1a2e" stroke-width="5"/>
  
  <!-- Curved seams -->
  <path d="M 256,116 Q 196,186 256,256 Q 316,326 256,396" fill="none" stroke="#1a1a2e" stroke-width="5"/>
  <path d="M 116,256 Q 186,196 256,256 Q 326,316 396,256" fill="none" stroke="#1a1a2e" stroke-width="5"/>
  
  <!-- Highlight -->
  <circle cx="216" cy="216" r="25" fill="rgba(255,255,255,0.4)"/>
  
  <!-- Text at bottom -->
  <text x="256" y="460" font-family="Arial Black" font-size="48" font-weight="bold" text-anchor="middle" fill="#ffd700">NBA</text>
</svg>
